# TERIQEN hardened Nginx v1.2. Replace certificate paths only if Certbot uses a different live name.
limit_req_zone $binary_remote_addr zone=teriqen_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=teriqen_reset:10m rate=5r/m;

server { listen 80 default_server; listen [::]:80 default_server; server_name _; return 444; }
server { listen 80; listen [::]:80; server_name app.cadupiushealthassist.com; return 301 https://$host$request_uri; }

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/app.cadupiushealthassist.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.cadupiushealthassist.com/privkey.pem;
    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.cadupiushealthassist.com;
    ssl_certificate /etc/letsencrypt/live/app.cadupiushealthassist.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.cadupiushealthassist.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 10M;

    location = / { limit_req zone=teriqen_login burst=10 nodelay; include proxy_params; proxy_set_header Host app.cadupiushealthassist.com; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host app.cadupiushealthassist.com; proxy_set_header X-Forwarded-Port 443; proxy_pass http://unix:/run/teriqen/teriqen.sock; }
    location = /forgot-password { limit_req zone=teriqen_reset burst=5 nodelay; include proxy_params; proxy_set_header Host app.cadupiushealthassist.com; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_pass http://unix:/run/teriqen/teriqen.sock; }
    # Bearer-style tokens must never be retained in Nginx access logs.
    location ~ ^/reset-password/ { access_log off; include proxy_params; proxy_set_header Host app.cadupiushealthassist.com; proxy_set_header X-Forwarded-Proto https; proxy_pass http://unix:/run/teriqen/teriqen.sock; }
    location ~ ^/whatsapp/privacy/ { access_log off; include proxy_params; proxy_set_header Host app.cadupiushealthassist.com; proxy_set_header X-Forwarded-Proto https; proxy_pass http://unix:/run/teriqen/teriqen.sock; }
    location = /broadcast-management/unsubscribe { access_log off; include proxy_params; proxy_set_header Host app.cadupiushealthassist.com; proxy_set_header X-Forwarded-Proto https; proxy_pass http://unix:/run/teriqen/teriqen.sock; }
    location / { include proxy_params; proxy_set_header Host app.cadupiushealthassist.com; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host app.cadupiushealthassist.com; proxy_set_header X-Forwarded-Port 443; proxy_read_timeout 120s; proxy_connect_timeout 10s; proxy_pass http://unix:/run/teriqen/teriqen.sock; }
}
